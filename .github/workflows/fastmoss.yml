name: FastMoss 飞书产品趋势推送

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-fastmoss-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行 FastMoss 推送
        env:
          FASTMOSS_API_KEY: ${{ secrets.FASTMOSS_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

          REGION: ${{ vars.REGION }}
          CATEGORY_ID: ${{ vars.CATEGORY_ID }}
          PAGE_SIZE: ${{ vars.PAGE_SIZE }}

        run: python fastmoss_products.py
