name: Morning Weather
  
on:
    schedule:
      - cron: '5 1 * * *'
    workflow_dispatch:
    
jobs:
    push-weather:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
        - run: pip install requests lunardate chinesecalendar
        - run: python weather.py
          env:
            QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}

