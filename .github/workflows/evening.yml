name: Evening Greeting
  
on:
    workflow_dispatch:

jobs:
    push-evening:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
        - run: pip install requests chinesecalendar
        - name: 发送下班卡片
          env:
            TIANAPI_KEY: ${{ secrets.TIANAPI_KEY }}
          run: python evening.py
        - run: python evening.py
