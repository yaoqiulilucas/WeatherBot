name: London Weather
  
on:
    schedule:
      - cron: '0 7 * * *'
    workflow_dispatch:
    
jobs:
    push-london:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with: 
            python-version: '3.11'
        - run: pip install requests
        - run: python london_weather.py
        
